name: Build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  release:
    types: [published]   # build and attach the downloads to the release

jobs:
  xbox:
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # to attach downloads to releases
    steps:
      - uses: actions/checkout@v5

      - name: Install nxdk prerequisites
        run: sudo apt-get update && sudo apt-get install -y clang lld llvm cmake bison flex

      - name: Get nxdk
        run: git clone --recursive --depth 1 --shallow-submodules https://github.com/XboxDev/nxdk.git ../nxdk

      - name: Build
        run: make NXDK_DIR=$GITHUB_WORKSPACE/../nxdk -j$(nproc)

      - name: Package
        run: |
          mkdir -p dist/2H4UX
          cp -r bin/. dist/2H4UX/
          cp README.md dist/2H4UX/
          (cd dist && zip -r 2H4UX-xbox.zip 2H4UX)
          cp 2H4UX.iso dist/

      - uses: actions/upload-artifact@v6
        with:
          name: 2H4UX-xbox
          path: |
            dist/2H4UX-xbox.zip
            dist/2H4UX.iso

      - name: Attach downloads to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          body_path: RELEASE_NOTES.md
          files: |
            dist/2H4UX-xbox.zip
            dist/2H4UX.iso
